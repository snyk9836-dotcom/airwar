<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة بوتات ماينكرافت</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2226;--panel:#262f35;--line:#3a464e;--text:#e8ecee;--mute:#93a1a9;--ok:#4fd6a0;--warn:#f0b64a;--bad:#e5604d;--accent:#5aa9e6}
@media(prefers-color-scheme:light){:root{--bg:#eef1f3;--panel:#fff;--line:#d3dadf;--text:#1b2328;--mute:#5d6b73;--ok:#12906a;--warn:#a96c00;--bad:#c23b28;--accent:#1f6fb5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--text);font-size:.95rem}
button{font:inherit;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--accent);color:#fff}
button.s{background:var(--line);color:var(--text)} button.d{background:var(--bad)} button.g{background:var(--ok);color:#06241a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head b{font-size:1.15rem} .sp{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute);display:inline-block}
.online .dot{background:var(--ok)} .connecting .dot{background:var(--warn)}
.console{height:200px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin:10px 0;font-size:.9rem}
.console div{padding:1px 0} .console span{color:var(--mute);margin-inline-end:8px;font-size:.8rem}
.say{display:flex;gap:8px}
.mute{color:var(--mute);font-size:.9rem}
#login{max-width:340px;margin:12vh auto}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
  <h1>تسجيل الدخول</h1>
  <label for="pw">كلمة سر اللوحة</label>
  <input id="pw" type="password">
  <p id="err" class="mute" style="color:var(--bad)"></p>
  <button id="go" style="width:100%">دخول</button>
</div>

<div id="app" hidden>
  <h1>لوحة بوتات ماينكرافت بيدروك</h1>
  <div class="card">
    <b>إضافة بوت</b>
    <div class="row">
      <div><label>اسم البوت</label><input id="n" type="text" value="Bot1"></div>
      <div><label>IP السيرفر</label><input id="h" type="text" placeholder="example.aternos.me"></div>
      <div><label>البورت</label><input id="p" type="number" value="19132"></div>
      <div><label>الإصدار (اختياري)</label><input id="v" type="text" placeholder="مثال 1.21.80"></div>
    </div>
    <div class="row">
      <div>
        <div class="chk"><input id="off" type="checkbox" checked><label for="off" style="margin:0;color:inherit">بدون حساب Xbox (السيرفر لا يطلب توثيق)</label></div>
        <div class="chk"><input id="afk" type="checkbox" checked><label for="afk" style="margin:0;color:inherit">AFK (حركة ذراع دورية)</label></div>
        <div class="chk"><input id="rec" type="checkbox" checked><label for="rec" style="margin:0;color:inherit">إعادة اتصال تلقائية</label></div>
        <div class="chk"><input id="ai" type="checkbox" checked><label for="ai" style="margin:0;color:inherit">رد ذكي على الشات</label></div>
      </div>
      <div>
        <label>متى يرد؟</label>
        <select id="mode"><option value="all">على كل رسائل الشات</option><option value="mention">فقط إذا ذُكر اسمه</option></select>
        <label>رسالة دورية (اختياري)</label><input id="am" type="text">
        <label>كل كم دقيقة</label><input id="amin" type="number" value="5" min="1">
      </div>
    </div>
    <p><button id="add" class="g">إضافة البوت</button></p>
  </div>
  <div id="list"></div>
  <p id="empty" class="mute">لا يوجد بوتات بعد. أضف أول بوت من النموذج أعلاه.</p>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const ST={offline:'غير متصل',connecting:'جاري الاتصال',online:'متصل'};
let ws,pass='',bots={};
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({type:'auth',pass}));
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='denied'){$('err').textContent='كلمة السر غير صحيحة';sessionStorage.removeItem('pw');return;}
    if(m.type==='init'){$('login').hidden=true;$('app').hidden=false;sessionStorage.setItem('pw',pass);bots={};$('list').innerHTML='';m.bots.forEach(b=>{bots[b.id]=b;render(b);b.logs.forEach(l=>addLog(b.id,l));});upd();}
    if(m.type==='bot'){const o=bots[m.bot.id];bots[m.bot.id]=Object.assign(o||{},m.bot);render(bots[m.bot.id]);upd();}
    if(m.type==='log')addLog(m.id,m.line);
    if(m.type==='removed'){delete bots[m.id];const el=$('b'+m.id);el&&el.remove();upd();}
  };
  ws.onclose=()=>setTimeout(()=>{if(pass)connect()},3000);
}
function upd(){$('empty').hidden=Object.keys(bots).length>0}
function act(id,type,extra){ws.send(JSON.stringify(Object.assign({type,id},extra||{})))}
function render(b){
  let el=$('b'+b.id);
  if(!el){
    el=document.createElement('div');el.id='b'+b.id;el.className='card';
    el.innerHTML=`<div class="head"><span class="dot"></span><b></b><span class="mute addr"></span><span class="mute st"></span><span class="sp"></span>
      <button class="g go">تشغيل</button><button class="s stp">إيقاف</button><button class="d rm">حذف</button></div>
      <div class="console"></div>
      <div class="say"><input type="text" placeholder="اكتب رسالة ليرسلها البوت في الشات"><button class="snd">إرسال</button></div>`;
    $('list').prepend(el);
    el.querySelector('.go').onclick=()=>act(b.id,'start');
    el.querySelector('.stp').onclick=()=>act(b.id,'stop');
    el.querySelector('.rm').onclick=()=>confirm('حذف هذا البوت؟')&&act(b.id,'remove');
    const inp=el.querySelector('.say input');
    const sd=()=>{if(inp.value.trim()){act(b.id,'say',{msg:inp.value.trim()});inp.value='';}};
    el.querySelector('.snd').onclick=sd;inp.onkeydown=e=>e.key==='Enter'&&sd();
  }
  el.className='card '+b.status;
  el.querySelector('b').textContent=b.cfg.name;
  el.querySelector('.addr').textContent=b.cfg.host+':'+b.cfg.port;
  el.querySelector('.st').textContent=ST[b.status];
}
function addLog(id,l){
  const c=document.querySelector('#b'+id+' .console');if(!c)return;
  const d=document.createElement('div'),s=document.createElement('span');
  s.textContent=l.t;d.append(s,document.createTextNode(l.m));c.append(d);c.scrollTop=c.scrollHeight;
}
$('go').onclick=()=>{pass=$('pw').value;$('err').textContent='';connect();};
$('pw').onkeydown=e=>e.key==='Enter'&&$('go').click();
$('add').onclick=()=>{
  if(!$('n').value.trim()||!$('h').value.trim())return alert('اكتب اسم البوت وعنوان السيرفر');
  ws.send(JSON.stringify({type:'add',cfg:{name:$('n').value.trim(),host:$('h').value.trim(),port:+$('p').value||19132,version:$('v').value.trim(),
    offline:$('off').checked,afk:$('afk').checked,reconnect:$('rec').checked,ai:$('ai').checked,mode:$('mode').value,autoMsg:$('am').value.trim(),autoMin:+$('amin').value||5}}));
};
const saved=sessionStorage.getItem('pw');if(saved){pass=saved;connect();}
</script>
</body>
</html>
